[package]
name = "installer"
description = "MW2 in Elden Ring: installer, launcher (shortcut target), updater and uninstaller (docs/INSTALLER_DESIGN.md P1). Never linked into mw2er.dll."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The release step names the file MW2inER-<version>-setup.exe; installed, it is <root>\MW2inER.exe.
[[bin]]
name = "MW2inER-setup"
path = "src/main.rs"

[lib]
name = "installer"
path = "src/lib.rs"

[dependencies]
# P2: the Rust regulation builder, called in-process by the regulation step (no WitchyBND)
regbuild.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
pelite.workspace = true
sha2.workspace = true
zip.workspace = true
ureq.workspace = true
eframe.workspace = true
windows = { workspace = true, features = [
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
# the development-only page screenshots (src/gui/shots.rs)
png.workspace = true
